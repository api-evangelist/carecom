name: Care.com
kind: company
description: >-
  Care.com is a two-sided online marketplace that connects families with
  caregivers across childcare, senior care, pet care, housekeeping, tutoring,
  and special-needs care, plus a "Care for Business" employer benefit used by
  companies such as Google, Starbucks, and Best Buy. Founded in 2007 by Sheila
  Lirio Marcelo, the company went public on the NYSE (CRCM) in 2014 and was
  acquired by IAC (IAC Inc.) in February 2020 for approximately $500 million,
  taking it private. Care.com is consumer- and enterprise-facing and does NOT
  publish a documented public developer API - there is no developer portal,
  no public API reference, and no self-service API keys. Its GitHub
  organization (github.com/caredotcom) contains only internal DevOps/infra
  tooling, not customer-facing API libraries. The only partner-facing
  programmatic surface is a private job-import integration inside Care.com
  Recruiting Solutions / Care for Business, used to sync job postings from an
  employer ATS; it is provisioned through a partnership agreement rather than
  openly documented. Note - Care.com is frequently confused with Caring.com
  (a separate senior-care directory owned by Caring, Inc. that DOES publish a
  JSON API at docs.caring.com); this entry is about care.com only. Access to
  the marketplace itself is via paid Basic and Premium memberships; there is no
  published API pricing.
