aid: carecom
name: Care.com
review:
  question: Does Care.com expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  apiStatus: none
  apiStatusNote: |
    Care.com does not publish any documented public developer API - REST,
    WebSocket, or otherwise. There is no developer portal, no public API
    reference, and no self-service API-key issuance for the care.com
    marketplace. Consequently there is no WebSocket surface to document.
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Care.com exposes no publicly documented
    event, streaming, or WebSocket transport - in fact it exposes no publicly
    documented API surface at all - so there is nothing to model.
findings:
  summary: |
    Care.com does not publish a documented public API, and therefore does not
    publish a documented public WebSocket API. Care.com is a consumer and
    enterprise two-sided marketplace connecting families with caregivers
    (childcare, senior care, pet care, housekeeping, tutoring, special-needs
    care). It was founded in 2007, went public on the NYSE (CRCM) in 2014, and
    was acquired by IAC (IAC Inc.) in February 2020 for roughly $500 million,
    at which point it went private. Extensive searching found no developer
    portal (no developer.care.com), no public REST or WebSocket API reference,
    no published OpenAPI/AsyncAPI, and no self-service API credentials. The
    Care.com GitHub organization (github.com/caredotcom) hosts only internal
    DevOps and infrastructure tooling (PagerDuty scheduling, Ansible inventory
    scripts, forked Grails plugins), not customer-facing API libraries. The
    only partner-facing programmatic capability located is a private job-import
    integration within Care.com Recruiting Solutions / Care for Business, which
    lets an employer or ATS push/sync job postings; it is arranged through a
    partnership agreement and is not openly documented. No ws:// or wss://
    endpoint is documented anywhere.
  apiAccessModel: |
    Private / partnership-only. There is no open, self-service developer
    program. Marketplace access for families and caregivers is via paid Basic
    and Premium memberships (subscription), not via an API. Any programmatic
    integration (e.g. recruiting/job-import for Care for Business) is
    negotiated directly with Care.com and is not publicly documented.
  disambiguation: |
    Care.com (care.com, IAC-owned childcare/senior/pet/housekeeping
    marketplace) is routinely confused with Caring.com (caring.com, a separate
    senior-care review/directory company that DOES publish a documented JSON
    API at docs.caring.com using a "Caring-Partner" header with a sandbox at
    sandbox-dir.caring.com). This review concerns care.com only; the caring.com
    API is a different provider and is out of scope here.
  transports:
    - protocol: REST
      scheme: https
      documented: false
      note: No public REST API reference exists for care.com. Any partner job-import integration is private and undocumented.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere for Care.com as of the review date.
    - protocol: AsyncAPI/Event
      scheme: n/a
      documented: false
      note: No public event, webhook, or streaming API is documented.
  endpointsConfirmedRest: []
  endpointsModeled: []
  endpointsHistorical: []
