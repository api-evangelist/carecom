    type: Reference
    note: Company history, 2014 IPO (CRCM), February 2020 IAC acquisition (~$500M).
  - url: https://docs.caring.com/
    type: Reference
    note: Belongs to Caring.com (a DIFFERENT company). Documented here only to disambiguate; not Care.com's API.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    Care.com exposes no documented public API of any kind, so no WebSocket
    surface and no AsyncAPI document exist to author. The apis.yml was written
    as an honest company entry with no `apis` array (no fabricated live API
    surface), capturing IAC ownership, the membership access model, the
    private partner job-import integration, and the Caring.com disambiguation.
